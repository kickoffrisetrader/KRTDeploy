<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Unity Web Player | Kickoff Rise Trader</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /*
      This root is the virtual landscape screen.
      Portrait phone: root is laid out as landscape, then rotated visually.
      Landscape phone: root is normal.
    */
    #unity-rotate-root {
      position: fixed;
      overflow: hidden;
      background: #000;
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Keep the Unity game frame locked to 16:9. Do not stretch it. */
    #unity-container {
      position: relative !important;
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
      aspect-ratio: 16 / 9;
      touch-action: manipulation;
    }

    #unity-canvas {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      background: #000;
      image-rendering: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #unity-loading-bar,
    #unity-warning {
      position: absolute;
      z-index: 10;
    }

    #unity-loading-bar {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #unity-warning {
      left: 0;
      top: 0;
      width: 100%;
    }

    #fullscreen-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s ease, transform 0.2s ease;
      touch-action: manipulation;
    }

    #fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    #fullscreen-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div id="unity-rotate-root">
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>
  </div>

  <button id="fullscreen-btn" type="button">⛶</button>

  <script>
    const BUILD_VERSION = "2.0.14";
    const GAME_WIDTH = 1920;
    const GAME_HEIGHT = 1080;
    const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;

    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js?v=" + BUILD_VERSION, {
          updateViaCache: "none"
        });
      }
    });

    const rotateRoot = document.querySelector("#unity-rotate-root");
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    let unityInstanceRef = null;
    let lastStableViewport = null;
    let lastOrientationKey = "";

    function getRawViewportSize() {
      const viewport = window.visualViewport;
      return {
        width: Math.round(viewport ? viewport.width : window.innerWidth),
        height: Math.round(viewport ? viewport.height : window.innerHeight)
      };
    }

    function isProbablyKeyboardOpen(rawSize) {
      if (!lastStableViewport) {
        return false;
      }

      const sameOrientation =
        (rawSize.width > rawSize.height) === (lastStableViewport.width > lastStableViewport.height);

      if (!sameOrientation) {
        return false;
      }

      // Mobile browsers usually shrink visualViewport height when the soft keyboard appears.
      return rawSize.height < lastStableViewport.height * 0.72;
    }

    function getLayoutViewportSize() {
      const rawSize = getRawViewportSize();
      const orientationKey = rawSize.width > rawSize.height ? "landscape" : "portrait";

      if (orientationKey !== lastOrientationKey) {
        lastOrientationKey = orientationKey;
        lastStableViewport = rawSize;
        return rawSize;
      }

      if (isProbablyKeyboardOpen(rawSize)) {
        // Keep the old full viewport while keyboard is open.
        // This prevents the 16:9 canvas from being scaled down or disappearing.
        return lastStableViewport;
      }

      // Update stable size only when the viewport is not keyboard-shrunk.
      // Use the largest dimensions seen in this orientation to resist browser UI bars.
      if (!lastStableViewport) {
        lastStableViewport = rawSize;
      } else {
        lastStableViewport = {
          width: Math.max(lastStableViewport.width, rawSize.width),
          height: Math.max(lastStableViewport.height, rawSize.height)
        };
      }

      return lastStableViewport;
    }

    function applyForcedLandscapeLayout() {
      const size = getLayoutViewportSize();
      const isPortrait = size.height > size.width;

      // In portrait, create a landscape coordinate space by swapping width/height.
      const virtualWidth = isPortrait ? size.height : size.width;
      const virtualHeight = isPortrait ? size.width : size.height;

      rotateRoot.style.width = virtualWidth + "px";
      rotateRoot.style.height = virtualHeight + "px";

      if (isPortrait) {
        rotateRoot.style.left = "50%";
        rotateRoot.style.top = "50%";
        rotateRoot.style.transform = "translate(-50%, -50%) rotate(90deg)";
      } else {
        rotateRoot.style.left = "0";
        rotateRoot.style.top = "0";
        rotateRoot.style.transform = "none";
      }

      // Contain 16:9 game frame inside the virtual landscape screen.
      let frameWidth = virtualWidth;
      let frameHeight = frameWidth / GAME_ASPECT;

      if (frameHeight > virtualHeight) {
        frameHeight = virtualHeight;
        frameWidth = frameHeight * GAME_ASPECT;
      }

      frameWidth = Math.floor(frameWidth);
      frameHeight = Math.floor(frameHeight);

      container.style.width = frameWidth + "px";
      container.style.height = frameHeight + "px";

      // Keep Unity render buffer fixed at 1920x1080.
      // CSS scales visually only; Unity should not stretch UI to phone aspect ratio.
      if (canvas.width !== GAME_WIDTH) {
        canvas.width = GAME_WIDTH;
      }

      if (canvas.height !== GAME_HEIGHT) {
        canvas.height = GAME_HEIGHT;
      }

      if (unityInstanceRef && unityInstanceRef.Module && unityInstanceRef.Module.setCanvasSize) {
        unityInstanceRef.Module.setCanvasSize(GAME_WIDTH, GAME_HEIGHT);
      }
    }

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(() => {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/KickoffRiseTrader.WebGL.loader.js?v=" + BUILD_VERSION;

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/KickoffRiseTrader.WebGL.data?v=" + BUILD_VERSION,
      frameworkUrl: buildUrl + "/KickoffRiseTrader.WebGL.framework.js?v=" + BUILD_VERSION,
      codeUrl: buildUrl + "/KickoffRiseTrader.WebGL.wasm?v=" + BUILD_VERSION,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Kickoff Rise Trader",
      productVersion: BUILD_VERSION,
      showBanner: unityShowBanner,

      // Do not let Unity/WebGL auto-resize render buffer to the rotated CSS frame.
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1
    };

    applyForcedLandscapeLayout();

    window.addEventListener("resize", () => {
      applyForcedLandscapeLayout();
      setTimeout(applyForcedLandscapeLayout, 100);
    });

    window.addEventListener("orientationchange", () => {
      lastStableViewport = null;
      lastOrientationKey = "";
      setTimeout(applyForcedLandscapeLayout, 100);
      setTimeout(applyForcedLandscapeLayout, 350);
      setTimeout(applyForcedLandscapeLayout, 800);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        applyForcedLandscapeLayout();
      });
      window.visualViewport.addEventListener("scroll", () => {
        applyForcedLandscapeLayout();
      });
    }

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      })
        .then((unityInstance) => {
          unityInstanceRef = unityInstance;
          loadingBar.style.display = "none";
          applyForcedLandscapeLayout();
        })
        .catch((message) => {
          alert(message);
        });
    };

    document.body.appendChild(script);

    // Fullscreen toggle logic
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕" : "⛶";
    }

    function enterFullscreen() {
      const element = document.documentElement;

      if (element.requestFullscreen) {
        return element.requestFullscreen();
      }

      if (element.webkitRequestFullscreen) {
        return element.webkitRequestFullscreen();
      }

      if (element.msRequestFullscreen) {
        return element.msRequestFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      }

      if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      }

      if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }
    }

    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen error:", error);
      }

      updateFullscreenButton();
      setTimeout(applyForcedLandscapeLayout, 100);
      setTimeout(applyForcedLandscapeLayout, 350);
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("msfullscreenchange", updateFullscreenButton);
    updateFullscreenButton();
  </script>
</body>

</html>
