<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Unity Web Player | Kickoff Rise Trader</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /*
      This outer layer is the virtual screen.
      - Landscape device: same size as the browser viewport.
      - Portrait device: width/height are swapped, then this layer is rotated.
    */
    #unity-viewport {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    /*
      This is the real Unity game frame.
      JS calculates its size so it always stays exactly 16:9.
      This prevents UI stretching/squashing on tall mobile screens.
    */
    #unity-container {
      position: relative !important;
      width: 100vw;
      height: 56.25vw;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
    }

    #unity-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #000;
    }

    #unity-loading-bar,
    #unity-warning {
      position: absolute;
      z-index: 10;
    }

    @media (orientation: portrait) {
      #unity-viewport {
        left: 50%;
        top: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    @media (orientation: landscape) {
      #unity-viewport {
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        transform: none;
      }
    }

    #fullscreen-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    #fullscreen-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div id="unity-viewport">
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>
  </div>

  <button id="fullscreen-btn" type="button">⛶</button>

  <script>
    const BUILD_VERSION = "2.0.7";
    const TARGET_ASPECT = 16 / 9;

    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js?v=" + BUILD_VERSION, {
          updateViaCache: "none"
        });
      }
    });

    const viewport = document.querySelector("#unity-viewport");
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function getViewportSize() {
      const visualViewport = window.visualViewport;

      return {
        width: visualViewport ? visualViewport.width : window.innerWidth,
        height: visualViewport ? visualViewport.height : window.innerHeight
      };
    }

    function resizeUnityFrame() {
      const size = getViewportSize();
      const isPortrait = size.height > size.width;

      // In portrait, we rotate the whole virtual screen, so swap width/height.
      const availableWidth = isPortrait ? size.height : size.width;
      const availableHeight = isPortrait ? size.width : size.height;

      let gameWidth = availableWidth;
      let gameHeight = gameWidth / TARGET_ASPECT;

      if (gameHeight > availableHeight) {
        gameHeight = availableHeight;
        gameWidth = gameHeight * TARGET_ASPECT;
      }

      viewport.style.width = availableWidth + "px";
      viewport.style.height = availableHeight + "px";

      if (isPortrait) {
        viewport.style.left = "50%";
        viewport.style.top = "50%";
        viewport.style.transform = "translate(-50%, -50%) rotate(90deg)";
      } else {
        viewport.style.left = "0";
        viewport.style.top = "0";
        viewport.style.transform = "none";
      }

      container.style.width = Math.round(gameWidth) + "px";
      container.style.height = Math.round(gameHeight) + "px";

      // Keep the canvas drawing buffer in the same 16:9 ratio.
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const bufferWidth = Math.round(gameWidth * dpr);
      const bufferHeight = Math.round(gameHeight * dpr);

      if (canvas.width !== bufferWidth) {
        canvas.width = bufferWidth;
      }

      if (canvas.height !== bufferHeight) {
        canvas.height = bufferHeight;
      }

    }

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(() => {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/KickoffRiseTrader.WebGL.loader.js?v=" + BUILD_VERSION;

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/KickoffRiseTrader.WebGL.data?v=" + BUILD_VERSION,
      frameworkUrl: buildUrl + "/KickoffRiseTrader.WebGL.framework.js?v=" + BUILD_VERSION,
      codeUrl: buildUrl + "/KickoffRiseTrader.WebGL.wasm?v=" + BUILD_VERSION,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Kickoff Rise Trader",
      productVersion: BUILD_VERSION,
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
    };

    resizeUnityFrame();

    window.addEventListener("resize", resizeUnityFrame);
    window.addEventListener("orientationchange", () => {
      setTimeout(resizeUnityFrame, 250);
      setTimeout(resizeUnityFrame, 600);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeUnityFrame);
    }

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      })
        .then((unityInstance) => {
          loadingBar.style.display = "none";
          resizeUnityFrame();
        })
        .catch((message) => {
          alert(message);
        });
    };

    document.body.appendChild(script);

    // Fullscreen toggle logic
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕" : "⛶";
    }

    function enterFullscreen() {
      const element = document.documentElement;

      if (element.requestFullscreen) {
        return element.requestFullscreen();
      }

      if (element.webkitRequestFullscreen) {
        return element.webkitRequestFullscreen();
      }

      if (element.msRequestFullscreen) {
        return element.msRequestFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      }

      if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      }

      if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }
    }

    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen error:", error);
      }

      updateFullscreenButton();
      setTimeout(resizeUnityFrame, 100);
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("msfullscreenchange", updateFullscreenButton);
    updateFullscreenButton();
  </script>
</body>

</html>
