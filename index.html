<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Unity Web Player | Kickoff Rise Trader</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /*
      Outer virtual landscape screen.
      In portrait mode this layer is rotated, but the game frame inside it
      always stays 16:9, so Unity UI is not stretched.
    */
    #unity-rotate-root {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed-aspect Unity frame. JS calculates exact px values. */
    #unity-container {
      position: relative !important;
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
      width: 100vw;
      height: 56.25vw;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
    }

    #unity-canvas {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      background: #000;
      image-rendering: auto;
    }

    #unity-loading-bar,
    #unity-warning {
      position: absolute;
      z-index: 10;
    }

    #unity-loading-bar {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #unity-warning {
      left: 0;
      top: 0;
      width: 100%;
    }


    /* Transparent input proxy used only in portrait forced-landscape mode.
       It remaps touch/click coordinates from the real portrait screen to the rotated 16:9 Unity canvas. */
    #unity-input-proxy {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      background: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #fullscreen-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    #fullscreen-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div id="unity-rotate-root">
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>
  </div>

  <div id="unity-input-proxy" aria-hidden="true"></div>

  <button id="fullscreen-btn" type="button">⛶</button>

  <script>
    const BUILD_VERSION = "2.0.13";
    const GAME_WIDTH = 1920;
    const GAME_HEIGHT = 1080;
    const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;

    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js?v=" + BUILD_VERSION, {
          updateViaCache: "none"
        });
      }
    });

    const rotateRoot = document.querySelector("#unity-rotate-root");
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");
    const inputProxy = document.querySelector("#unity-input-proxy");

    let unityInstanceRef = null;
    let layoutState = {
      isPortrait: false,
      screenWidth: 0,
      screenHeight: 0,
      virtualWidth: 0,
      virtualHeight: 0,
      frameWidth: 0,
      frameHeight: 0,
      frameLeft: 0,
      frameTop: 0
    };

    function getScreenSize() {
      const viewport = window.visualViewport;
      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
      };
    }

    function applyForcedLandscapeLayout() {
      const size = getScreenSize();
      const isPortrait = size.height > size.width;

      // The virtual landscape screen. In portrait, swap width/height and rotate it.
      const virtualWidth = isPortrait ? size.height : size.width;
      const virtualHeight = isPortrait ? size.width : size.height;

      rotateRoot.style.width = virtualWidth + "px";
      rotateRoot.style.height = virtualHeight + "px";

      if (isPortrait) {
        rotateRoot.style.left = "50%";
        rotateRoot.style.top = "50%";
        rotateRoot.style.transform = "translate(-50%, -50%) rotate(90deg)";
      } else {
        rotateRoot.style.left = "0";
        rotateRoot.style.top = "0";
        rotateRoot.style.transform = "none";
      }

      // Contain a 16:9 game frame inside the virtual landscape screen.
      let frameWidth = virtualWidth;
      let frameHeight = frameWidth / GAME_ASPECT;

      if (frameHeight > virtualHeight) {
        frameHeight = virtualHeight;
        frameWidth = frameHeight * GAME_ASPECT;
      }

      frameWidth = Math.floor(frameWidth);
      frameHeight = Math.floor(frameHeight);

      container.style.width = frameWidth + "px";
      container.style.height = frameHeight + "px";

      layoutState = {
        isPortrait,
        screenWidth: size.width,
        screenHeight: size.height,
        virtualWidth,
        virtualHeight,
        frameWidth,
        frameHeight,
        frameLeft: (virtualWidth - frameWidth) / 2,
        frameTop: (virtualHeight - frameHeight) / 2
      };

      // In portrait, the visual layer is rotated with CSS. Unity does not know about that rotation,
      // so the transparent proxy remaps touch/click coordinates before sending them to the canvas.
      inputProxy.style.display = isPortrait ? "block" : "none";

      // Important: keep Unity render buffer fixed at 1920x1080.
      // Only CSS scales it visually. This prevents aspect-ratio fighting and UI distortion.
      if (canvas.width !== GAME_WIDTH) {
        canvas.width = GAME_WIDTH;
      }

      if (canvas.height !== GAME_HEIGHT) {
        canvas.height = GAME_HEIGHT;
      }

      if (unityInstanceRef && unityInstanceRef.Module && unityInstanceRef.Module.setCanvasSize) {
        unityInstanceRef.Module.setCanvasSize(GAME_WIDTH, GAME_HEIGHT);
      }
    }

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(() => {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/KickoffRiseTrader.WebGL.loader.js?v=" + BUILD_VERSION;

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/KickoffRiseTrader.WebGL.data?v=" + BUILD_VERSION,
      frameworkUrl: buildUrl + "/KickoffRiseTrader.WebGL.framework.js?v=" + BUILD_VERSION,
      codeUrl: buildUrl + "/KickoffRiseTrader.WebGL.wasm?v=" + BUILD_VERSION,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Kickoff Rise Trader",
      productVersion: BUILD_VERSION,
      showBanner: unityShowBanner,

      // Do not let Unity/WebGL auto-resize the render buffer to the rotated CSS frame.
      // We keep the render buffer at 1920x1080 and only scale the HTML frame.
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1
    };

    applyForcedLandscapeLayout();

    window.addEventListener("resize", applyForcedLandscapeLayout);
    window.addEventListener("orientationchange", () => {
      setTimeout(applyForcedLandscapeLayout, 100);
      setTimeout(applyForcedLandscapeLayout, 350);
      setTimeout(applyForcedLandscapeLayout, 800);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", applyForcedLandscapeLayout);
      window.visualViewport.addEventListener("scroll", applyForcedLandscapeLayout);
    }

    function portraitClientToFramePoint(clientX, clientY) {
      if (!layoutState.isPortrait) {
        return null;
      }

      // Inverse of: rotateRoot translate(-50%, -50%) rotate(90deg).
      // Converts the real portrait screen coordinate into the virtual landscape coordinate system.
      const rootX = (layoutState.virtualWidth / 2) + (clientY - layoutState.screenHeight / 2);
      const rootY = (layoutState.virtualHeight / 2) - (clientX - layoutState.screenWidth / 2);

      const frameX = rootX - layoutState.frameLeft;
      const frameY = rootY - layoutState.frameTop;

      if (
        frameX < 0 ||
        frameY < 0 ||
        frameX > layoutState.frameWidth ||
        frameY > layoutState.frameHeight
      ) {
        return null;
      }

      return { x: frameX, y: frameY };
    }

    function framePointToUnityClient(framePoint) {
      const rect = canvas.getBoundingClientRect();

      // Feed Unity a synthetic coordinate that matches the unrotated 16:9 frame.
      // This prevents the visual button position and Unity's received pointer position from drifting apart.
      return {
        x: rect.left + (framePoint.x / layoutState.frameWidth) * rect.width,
        y: rect.top + (framePoint.y / layoutState.frameHeight) * rect.height
      };
    }

    function dispatchMouseLikeEvent(type, originalEvent, clientPoint) {
      const event = new MouseEvent(type, {
        bubbles: true,
        cancelable: true,
        view: window,
        clientX: clientPoint.x,
        clientY: clientPoint.y,
        screenX: clientPoint.x,
        screenY: clientPoint.y,
        button: originalEvent.button || 0,
        buttons: originalEvent.buttons || (type === "mouseup" || type === "click" ? 0 : 1),
        ctrlKey: originalEvent.ctrlKey || false,
        shiftKey: originalEvent.shiftKey || false,
        altKey: originalEvent.altKey || false,
        metaKey: originalEvent.metaKey || false
      });

      canvas.dispatchEvent(event);
    }

    function dispatchPointerLikeEvent(type, originalEvent, clientPoint) {
      if (!window.PointerEvent) {
        return;
      }

      const event = new PointerEvent(type, {
        bubbles: true,
        cancelable: true,
        composed: true,
        pointerId: originalEvent.pointerId || 1,
        pointerType: originalEvent.pointerType || "touch",
        isPrimary: originalEvent.isPrimary !== false,
        clientX: clientPoint.x,
        clientY: clientPoint.y,
        screenX: clientPoint.x,
        screenY: clientPoint.y,
        button: originalEvent.button || 0,
        buttons: originalEvent.buttons || (type === "pointerup" || type === "pointercancel" ? 0 : 1),
        pressure: type === "pointerup" || type === "pointercancel" ? 0 : (originalEvent.pressure || 0.5),
        width: originalEvent.width || 1,
        height: originalEvent.height || 1,
        ctrlKey: originalEvent.ctrlKey || false,
        shiftKey: originalEvent.shiftKey || false,
        altKey: originalEvent.altKey || false,
        metaKey: originalEvent.metaKey || false
      });

      canvas.dispatchEvent(event);
    }

    const activePointers = new Map();

    function handleProxyPointerEvent(event) {
      if (!layoutState.isPortrait) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      const framePoint = portraitClientToFramePoint(event.clientX, event.clientY);

      if (!framePoint && event.type !== "pointerup" && event.type !== "pointercancel") {
        return;
      }

      const pointToUse = framePoint || activePointers.get(event.pointerId);
      if (!pointToUse) {
        return;
      }

      const unityClientPoint = framePointToUnityClient(pointToUse);

      if (event.type === "pointerdown") {
        activePointers.set(event.pointerId, pointToUse);
        dispatchPointerLikeEvent("pointerdown", event, unityClientPoint);
        dispatchMouseLikeEvent("mousedown", event, unityClientPoint);
        return;
      }

      if (event.type === "pointermove") {
        activePointers.set(event.pointerId, pointToUse);
        dispatchPointerLikeEvent("pointermove", event, unityClientPoint);
        dispatchMouseLikeEvent("mousemove", event, unityClientPoint);
        return;
      }

      if (event.type === "pointerup") {
        dispatchPointerLikeEvent("pointerup", event, unityClientPoint);
        dispatchMouseLikeEvent("mouseup", event, unityClientPoint);
        dispatchMouseLikeEvent("click", event, unityClientPoint);
        activePointers.delete(event.pointerId);
        return;
      }

      if (event.type === "pointercancel") {
        dispatchPointerLikeEvent("pointercancel", event, unityClientPoint);
        dispatchMouseLikeEvent("mouseup", event, unityClientPoint);
        activePointers.delete(event.pointerId);
      }
    }

    ["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach((eventName) => {
      inputProxy.addEventListener(eventName, handleProxyPointerEvent, { passive: false });
    });

    // Fallback for old mobile browsers that do not support PointerEvent.
    function handleProxyTouchEvent(event) {
      if (window.PointerEvent || !layoutState.isPortrait) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      const changedTouch = event.changedTouches && event.changedTouches[0];
      if (!changedTouch) {
        return;
      }

      const framePoint = portraitClientToFramePoint(changedTouch.clientX, changedTouch.clientY);
      const pointToUse = framePoint || activePointers.get(changedTouch.identifier);
      if (!pointToUse) {
        return;
      }

      const fakeOriginal = {
        button: 0,
        buttons: event.type === "touchend" || event.type === "touchcancel" ? 0 : 1,
        ctrlKey: event.ctrlKey || false,
        shiftKey: event.shiftKey || false,
        altKey: event.altKey || false,
        metaKey: event.metaKey || false
      };

      const unityClientPoint = framePointToUnityClient(pointToUse);

      if (event.type === "touchstart") {
        activePointers.set(changedTouch.identifier, pointToUse);
        dispatchMouseLikeEvent("mousedown", fakeOriginal, unityClientPoint);
      } else if (event.type === "touchmove") {
        activePointers.set(changedTouch.identifier, pointToUse);
        dispatchMouseLikeEvent("mousemove", fakeOriginal, unityClientPoint);
      } else {
        dispatchMouseLikeEvent("mouseup", fakeOriginal, unityClientPoint);
        dispatchMouseLikeEvent("click", fakeOriginal, unityClientPoint);
        activePointers.delete(changedTouch.identifier);
      }
    }

    ["touchstart", "touchmove", "touchend", "touchcancel"].forEach((eventName) => {
      inputProxy.addEventListener(eventName, handleProxyTouchEvent, { passive: false });
    });


    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      })
        .then((unityInstance) => {
          unityInstanceRef = unityInstance;
          loadingBar.style.display = "none";
          applyForcedLandscapeLayout();
        })
        .catch((message) => {
          alert(message);
        });
    };

    document.body.appendChild(script);

    // Fullscreen toggle logic
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕" : "⛶";
    }

    function enterFullscreen() {
      const element = document.documentElement;

      if (element.requestFullscreen) {
        return element.requestFullscreen();
      }

      if (element.webkitRequestFullscreen) {
        return element.webkitRequestFullscreen();
      }

      if (element.msRequestFullscreen) {
        return element.msRequestFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      }

      if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      }

      if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }
    }

    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen error:", error);
      }

      updateFullscreenButton();
      setTimeout(applyForcedLandscapeLayout, 100);
      setTimeout(applyForcedLandscapeLayout, 350);
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("msfullscreenchange", updateFullscreenButton);
    updateFullscreenButton();
  </script>
</body>

</html>
